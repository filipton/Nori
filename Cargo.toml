[workspace]
resolver = "2"
members = ["crates/core", "crates/look", "crates/player", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
uniffi = "0.32"

# Signalsmith Stretch is about ten times slower unoptimised; keep it fast in debug builds and tests too.
[profile.dev.package.signalsmith-stretch]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
