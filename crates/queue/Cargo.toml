[package]
name = "nori-queue"
version.workspace = true
edition.workspace = true

# The queue the app plays: its list and order, the songs in it, how it moves, refilling it, the offline
# bridge, the ear's song, counting plays and what playing something means.
[lib]
name = "nori_queue"

[features]
# The uniffi exports the Android app's Kotlin bindings are generated from. A Rust client links the
# crate without them.
ffi = ["dep:uniffi", "nori-model/ffi", "nori-db/ffi", "nori-words/ffi", "nori-net/ffi", "nori-library/ffi", "nori-automix/ffi", "nori-settings/ffi"]

[dependencies]
uniffi = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
parking_lot = "0.12"
nori-model = { path = "../model" }
nori-db = { path = "../db" }
nori-words = { path = "../words" }
nori-net = { path = "../net" }
# A play counted goes into the library's history; a radio or a mix is drawn from the library.
nori-library = { path = "../library" }
nori-automix = { path = "../automix" }
nori-settings = { path = "../settings" }
nori-player = { path = "../player" }
