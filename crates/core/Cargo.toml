[package]
name = "norimusic"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "norimusic"

[dependencies]
uniffi.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
md-5 = "0.11"
thiserror = "2"
parking_lot = "0.12"
# The platform's HTTP transport is an async foreign trait (uniffi generates it through async-trait).
async-trait = "0.1"
# The local year (this year's albums) from the C library's time zone.
libc = "0.2"
jni = { version = "0.21", default-features = false }
# How music is played - the sound chain and AutoMix - lives in the shared player crate.
nori-player = { path = "../player" }
nori-look = { path = "../look" }
nori-text = { path = "../text" }

[dev-dependencies]
nori-player = { path = "../player", features = ["synth"] }
