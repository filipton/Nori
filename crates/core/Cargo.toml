[package]
name = "norimusic"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "norimusic"

[dependencies]
uniffi.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
md-5 = "0.11"
thiserror = "2"
parking_lot = "0.12"
jni = { version = "0.21", default-features = false }
# How music is played - the sound chain and AutoMix - lives in the shared player crate.
nori-player = { path = "../player" }
nori-look = { path = "../look" }

[dev-dependencies]
nori-player = { path = "../player", features = ["synth"] }
