[package]
name = "norimusic"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "norimusic"

[dependencies]
uniffi.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
md-5 = "0.11"
thiserror = "2"
parking_lot = "0.12"
jni = { version = "0.21", default-features = false }
# AutoMix: the analysis FFT, and Signalsmith Stretch (MIT, C++ built with cc) for tempo changes.
rustfft = "6"
signalsmith-stretch = "0.1"

# Test-only: the resample evaluation in automix::resample compares the transition-time cubic
# interpolator against a sinc resampler. It stays out of release builds: transitions are seconds
# of mixed music, where the cubic's worst spur measures below -15 dB on a torture-test chord.
[dev-dependencies]
rubato = "5.0.0"
