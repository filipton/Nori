[package]
name = "nori-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A terminal client built from the core, nori-engine and the cpal output: the proof that a new client writes no player"

[[bin]]
name = "nori-cli"
path = "src/main.rs"

[features]
# "Better beat detection": the measurer runs Beat This! through tract (nori-engine's feature). Off unless asked
# for, so a plain build links nothing of it.
neural-beats = ["nori-engine/neural-beats"]

[dependencies]
nori-core = { path = "../core", default-features = false }
nori-engine = { path = "../engine", features = ["core"] }
nori-output-cpal = { path = "../output-cpal" }
nori-http = { path = "../http" }
nori-mpris = { path = "../mpris" }
