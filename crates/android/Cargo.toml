[package]
name = "nori-android"
version.workspace = true
edition.workspace = true

# The library Android loads (libnorimusic.so): the core with its uniffi JNI scaffolding (generated by
# build.rs), and the JNI doors the per-buffer and per-frame calls go through. The generated Kotlin loads
# the library by the core's uniffi.toml `cdylib_name`, which is this lib's name.
[lib]
crate-type = ["cdylib"]
name = "norimusic"

[dependencies]
nori-core = { package = "norimusic-core", path = "../core" }
nori-player = { path = "../player" }
nori-look = { path = "../look" }
jni = { version = "0.21", default-features = false }
parking_lot = "0.12"
# The generated scaffolding calls into these; uniffi wants the crate that holds it to depend on every
# crate that exports something, and on uniffi itself.
uniffi = { workspace = true }
uniffi-bindgen-kotlin-jni-runtime = { path = "../uniffi-jni-runtime" }

[build-dependencies]
uniffi-bindgen-kotlin-jni = { workspace = true }
