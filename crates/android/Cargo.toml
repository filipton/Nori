[package]
name = "nori-android"
version.workspace = true
edition.workspace = true

# The library Android loads (libnorimusic.so): the core with its uniffi JNI scaffolding (generated by
# build.rs), and the JNI doors the per-buffer and per-frame calls go through. The generated Kotlin loads
# the library by the core's uniffi.toml `cdylib_name`, which is this lib's name.
[lib]
crate-type = ["cdylib"]
name = "norimusic"

[features]
# "Better beat detection" (nori-engine's feature): Beat This! through tract in the measurer, with the model shipped
# as an asset. On in the debug and perf builds, off in a release one unless asked (core/build.gradle.kts): tract
# makes this library 15.5 MB bigger for arm64 (9.8 to 25.3 MB).
neural-beats = ["nori-engine/neural-beats"]

[dependencies]
nori-core = { path = "../core" }
# Every crate whose exports the scaffolding covers, each with its uniffi records on.
nori-model = { path = "../model", features = ["ffi"] }
nori-db = { path = "../db", features = ["ffi"] }
nori-net = { path = "../net", features = ["ffi"] }
nori-library = { path = "../library", features = ["ffi"] }
nori-automix = { path = "../automix", features = ["ffi"] }
nori-settings = { path = "../settings", features = ["ffi"] }
nori-lyrics = { path = "../lyrics", features = ["ffi"] }
nori-devices = { path = "../devices", features = ["ffi"] }
nori-queue = { path = "../queue", features = ["ffi"] }
nori-transfers = { path = "../transfers", features = ["ffi"] }
nori-perf = { path = "../perf", features = ["ffi"] }
nori-player = { path = "../player" }
nori-look = { path = "../look" }
nori-covers = { path = "../covers" }
# The cover loader's transport (covers.rs) is the core's async Transport trait.
async-trait = "0.1"
# The Rust playback path (player.rs, track.rs): the engine playing the core's queue into an AudioTrack.
nori-engine = { path = "../engine", features = ["core"] }
libc = "0.2"
jni = { version = "0.21", default-features = false }
parking_lot = "0.12"
# The generated scaffolding calls into these; uniffi wants the crate that holds it to depend on every
# crate that exports something, and on uniffi itself.
uniffi = { workspace = true }
uniffi-bindgen-kotlin-jni-runtime = { path = "../uniffi-jni-runtime" }

[dev-dependencies]
# track.rs's tests run the engine end to end with the simulated player's transition planner.
nori-player = { path = "../player", features = ["synth"] }
nori-testdir = { path = "../testdir" }

[build-dependencies]
uniffi-bindgen-kotlin-jni = { workspace = true }
